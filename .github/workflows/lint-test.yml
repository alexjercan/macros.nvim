---
on:
  # Branch-filtered so a release tag does not run this suite twice: once here
  # and once through release.yml's test job.
  push:
    branches:
      - main
  pull_request:
  # Called by release.yml so a tag cannot publish without lint and tests.
  workflow_call:
name: lint-test

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v3
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --color always --check lua

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nebularg/actions-luacheck@v1
        with:
          files: lua/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim-versions: ['stable', 'nightly']
    name: test
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim
          key: nvim-${{ matrix.nvim-versions }}

      - name: checkout
        uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-versions }}

      - name: run tests
        run: make test
